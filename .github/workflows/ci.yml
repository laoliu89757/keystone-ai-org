name: ci

# 本仓库两层：编制一致性（org-consistency）+ 学习服务（pytest / stdlib-only）+ 仓库卫生。
# 产品仓库接管后，另加 backend / frontend / contract / migrations / e2e（见 docs/04 §2.4）。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  org-consistency:
    name: org-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 五处一致：组织表 / 角色卡 / profile / 钩子白名单 / AGENTS.md
      - run: python scripts/check_org.py
      # 门禁演练（本地可验证子集）；有 FAIL 即阻断，PENDING 不算失败
      - name: gate drill (local subset)
        run: python scripts/gate_drill.py
      - name: profile patch is valid json
        run: python -c "import json;json.load(open('.paseo/config.patch.json',encoding='utf-8'));print('ok')"
      - name: workflow yaml is valid
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python scripts/check_workflows.py

      # 受保护文件完整性：任何未声明的修改都会变红（改动需同步更新 --baseline 并在 PR 说明理由）
      - name: protected files unchanged
        run: python scripts/harden_local.py --verify

      - name: hooks syntax
        run: |
          bash -n scripts/hooks/guard_bash.sh
          bash -n scripts/hooks/guard_paths.sh

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 红线：learning-service/ 只许标准库（INTENT-001 §3）
      - name: stdlib-only gate
        run: python scripts/check_stdlib_only.py
      - name: install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: run tests
        run: python -m pytest tests/ -q

  pr-size:
    name: pr-size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: changed lines <= 600
        run: |
          changed=$(git diff --numstat origin/${{ github.base_ref }}...HEAD | awk '{s+=$1+$2} END {print s+0}')
          echo "changed lines: $changed"
          if [ "$changed" -gt 600 ]; then
            echo '::error::PR 超过 600 行，请拆分（AGENTS.md 第 4 节第 3 条）'
            exit 1
          fi

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    # gitleaks-action 需要读提交并在 PR 上回评论；只给 contents:read 会报
    # "Resource not accessible by integration"。这里按 job 单独提权，不放宽全局。
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
